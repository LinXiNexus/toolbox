<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工具集">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>常用工具集</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --border:#272d39;
  --text:#d7dce5; --dim:#8b93a3; --accent:#3fc1c9; --ok:#4ade80;
  --err:#f87171; --warn:#fbbf24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:40px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--border);
  background:rgba(15,17,21,.92);backdrop-filter:blur(8px)}
header h1{margin:0;font-size:16px;font-weight:600;white-space:nowrap}
header .ver{color:var(--dim);font-size:12px;font-weight:400}
header .sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel2);
  color:var(--text);padding:8px 14px;border-radius:9px;transition:.15s}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.98)}
button.pri{background:var(--accent);color:#08222a;border-color:var(--accent);font-weight:600}
button.sm{padding:6px 11px;font-size:12.5px}
main{max-width:760px;margin:0 auto;padding:0 14px}
.group{margin-bottom:16px}
.gh{width:100%;display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;
  background:linear-gradient(90deg,#1e2430,#161a21);
  border:1px solid var(--border);border-radius:13px;padding:16px 17px;
  font-size:16px;font-weight:600;color:var(--text)}
.gh:hover{border-color:var(--accent)}
.gh:active{transform:scale(.995)}
.gh .garw{color:var(--accent);font-size:12px;transition:transform .2s;display:inline-block}
.group.on .gh .garw{transform:rotate(90deg)}
.group.on .gh{border-color:var(--accent);color:var(--accent)}
.gh .gcount{margin-left:auto;font-size:12px;font-weight:400;color:var(--dim);
  border:1px solid var(--border);border-radius:999px;padding:2px 10px}
.group.on .gh .gcount{border-color:var(--accent);color:var(--accent)}
.gb{display:none;padding:10px 0 0 10px;border-left:2px solid var(--border);margin-left:12px}
.group.on .gb{display:block}
.acc{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:9px;overflow:hidden}
.acc-h{width:100%;text-align:left;background:none;border:0;border-radius:0;padding:14px 16px;
  display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--text)}
.acc-h:hover{background:var(--panel2)}
.acc-h .arw{color:var(--dim);transition:.2s;font-size:11px;width:10px}
.acc.on .acc-h{color:var(--accent);font-weight:600}
.acc.on .acc-h .arw{transform:rotate(90deg)}
.acc-b{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.acc.on .acc-b{display:block}
.acc-b>*:first-child{margin-top:14px}
label{display:block;color:var(--dim);font-size:12px;margin:0 0 5px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--bg);
  border:1px solid var(--border);color:var(--text);border-radius:9px;padding:11px 12px;
  font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:88px}
select{font-family:inherit}
.f{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.f{flex:1;min-width:120px;margin-bottom:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;margin:0;padding:8px 14px;border:1px solid var(--border);
  border-radius:9px;cursor:pointer;color:var(--text);font-size:14px;background:var(--bg)}
.seg input{accent-color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);color:var(--accent)}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
.lh{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.lh label{margin:0;flex:1}
.lh button{padding:4px 11px;font-size:12px;flex:none}
.lh button.ok{border-color:var(--accent);color:var(--accent)}
textarea.drag{border-color:var(--accent);background:#122026}
.fhint{color:var(--accent)}
.go{margin-top:14px}
.go button{width:100%;padding:12px;font-size:15px}
.out:empty{display:none}
.out{margin-top:14px}
pre{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:12px;
  overflow:auto;max-height:380px;margin:0;font:12.5px/1.75 ui-monospace,Menlo,Consolas,monospace;
  white-space:pre-wrap;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:none}
.kv{display:grid;grid-template-columns:80px 1fr;gap:7px 12px}
.kv b{color:var(--dim);font-weight:400;font-size:13px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}.dim{color:var(--dim)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;
  border:1px solid var(--border);color:var(--dim)}
.stat{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.stat b{color:var(--warn)}
.segs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.segs span{font-family:ui-monospace,monospace;font-size:12px;background:var(--panel2);
  border:1px solid var(--border);padding:2px 7px;border-radius:5px}
#msg{max-width:760px;margin:0 auto;padding:0 14px}
#msg:empty{display:none}
.banner{padding:10px 13px;border-radius:9px;font-size:13px;margin-top:12px;
  border:1px solid var(--border);background:var(--panel2)}
footer{max-width:760px;margin:26px auto 0;padding:0 14px;color:var(--dim);font-size:12px;text-align:center}
</style>
</head>
<body>

<header>
  <h1>常用工具集 <span class="ver" id="ver"></span></h1>
  <span class="sp"></span>
  <button class="sm" id="btnCheck">检查更新</button>
</header>

<div id="msg"></div>

<main>

<section class="group on" data-group="id">
<button class="gh"><span class="garw">▶</span>身份证<span class="gcount">6 个功能</span></button>
<div class="gb">

<div class="acc on" data-key="id/brute" data-out="out-brute">
  <button class="acc-h"><span class="arw">▶</span>后四位穷举</button>
  <div class="acc-b">
    <div class="f"><label>前 14 位（认不清的位用 ? 占位）</label>
      <input type="text" id="brute-prefix" value="44030519900307" placeholder="44030519900307"></div>
    <div class="hint">1-6 地址码 ｜ 7-14 出生日期 ｜ 15-17 顺序码 ｜ 18 校验码</div>
    <div class="f" style="margin-top:12px"><label>性别</label>
      <div class="seg">
        <label><input type="radio" name="brute-g" value="男" checked>男</label>
        <label><input type="radio" name="brute-g" value="女">女</label>
      </div></div>
    <div class="go"><button class="pri" data-act="id/brute">开始穷举</button></div>
    <div class="out" id="out-brute"></div>
  </div>
</div>

<div class="acc" data-key="id/check" data-out="out-check">
  <button class="acc-h"><span class="arw">▶</span>校验 18 位号码</button>
  <div class="acc-b">
    <div class="f"><label>完整 18 位</label>
      <input type="text" id="check-raw" value="11010519491231002X" placeholder="11010519491231002X"></div>
    <div class="go"><button class="pri" data-act="id/check">校验</button></div>
    <div class="out" id="out-check"></div>
  </div>
</div>

<div class="acc" data-key="id/checkdigit" data-out="out-cd">
  <button class="acc-h"><span class="arw">▶</span>17 位补校验位</button>
  <div class="acc-b">
    <div class="f"><label>前 17 位</label>
      <input type="text" id="cd-raw" value="11010519491231002" placeholder="11010519491231002"></div>
    <div class="go"><button class="pri" data-act="id/checkdigit">计算校验位</button></div>
    <div class="out" id="out-cd"></div>
  </div>
</div>

<div class="acc" data-key="id/info" data-out="out-info">
  <button class="acc-h"><span class="arw">▶</span>信息提取</button>
  <div class="acc-b">
    <div class="f"><label>完整 18 位</label>
      <input type="text" id="info-raw" value="440305199003070014" placeholder="440305199003070014"></div>
    <div class="go"><button class="pri" data-act="id/info">提取</button></div>
    <div class="out" id="out-info"></div>
  </div>
</div>

<div class="acc" data-key="id/derive" data-out="out-derive">
  <button class="acc-h"><span class="arw">▶</span>按生肖 / 星座反推</button>
  <div class="acc-b">
    <div class="row">
      <div class="f"><label>生肖</label><select id="dv-sx"></select></div>
      <div class="f"><label>星座</label><select id="dv-xz"></select></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="f"><label>最小年龄</label><input type="number" id="dv-a1" placeholder="30"></div>
      <div class="f"><label>最大年龄</label><input type="number" id="dv-a2" placeholder="40"></div>
    </div>
    <div class="hint">至少填一项，否则会覆盖 1900 年至今</div>
    <div class="go"><button class="pri" data-act="id/derive">反推生日</button></div>
    <div class="out" id="out-derive"></div>
  </div>
</div>

<div class="acc" data-key="id/batch" data-out="out-batch">
  <button class="acc-h"><span class="arw">▶</span>批量校验</button>
  <div class="acc-b">
    <div class="f">
      <div class="lh"><label>号码列表（每行一个，# 开头跳过）</label>
        <button type="button" class="sm" data-file="batch-text">选择文件</button></div>
      <textarea id="batch-text" placeholder="11010519491231002X&#10;110105194912310021&#10;123"></textarea>
      <input type="file" id="file-batch-text" accept=".txt,.csv,.log,.dat,text/*" hidden></div>
    <div class="go"><button class="pri" data-act="id/batch">批量校验</button></div>
    <div class="out" id="out-batch"></div>
  </div>
</div>

</div>
</section>

<section class="group on" data-group="phone">
<button class="gh"><span class="garw">▶</span>手机号<span class="gcount">4 个功能</span></button>
<div class="gb">

<div class="acc" data-key="phone/lookup" data-out="out-lookup">
  <button class="acc-h"><span class="arw">▶</span>归属地查询</button>
  <div class="acc-b">
    <div class="f">
      <div class="lh"><label>手机号（空格或逗号分隔）</label>
        <button type="button" class="sm" data-file="lk-text">选择文件</button></div>
      <textarea id="lk-text">13800138000</textarea>
      <input type="file" id="file-lk-text" accept=".txt,.csv,.log,.dat,text/*" hidden></div>
    <div class="go"><button class="pri" data-act="phone/lookup">查询</button></div>
    <div class="out" id="out-lookup"></div>
  </div>
</div>

<div class="acc" data-key="phone/brute" data-out="out-pbrute">
  <button class="acc-h"><span class="arw">▶</span>前三后二穷举</button>
  <div class="acc-b">
    <div class="row">
      <div class="f"><label>前三位</label><input type="text" id="pb-seg3" value="138" maxlength="3"></div>
      <div class="f"><label>后两位</label><input type="text" id="pb-last2" value="88" maxlength="2"></div>
    </div>
    <div class="f" style="margin-top:12px"><label>归属地筛选（可选）</label>
      <input type="text" id="pb-region" placeholder="留空 = 中间全排列 100 万"></div>
    <div class="go"><button class="pri" data-act="phone/brute">穷举</button></div>
    <div class="out" id="out-pbrute"></div>
  </div>
</div>

<div class="acc" data-key="phone/seg" data-out="out-seg">
  <button class="acc-h"><span class="arw">▶</span>号段反查</button>
  <div class="acc-b">
    <div class="f"><label>地区关键字</label>
      <input type="text" id="seg-kw" placeholder="北京 / 唐山 / 深圳"></div>
    <div class="hint">全库检索约 1.5 秒</div>
    <div class="go"><button class="pri" data-act="phone/seg">反查</button></div>
    <div class="out" id="out-seg"></div>
  </div>
</div>

<div class="acc" data-key="phone/format" data-out="out-fmt">
  <button class="acc-h"><span class="arw">▶</span>格式化 / 脱敏</button>
  <div class="acc-b">
    <div class="f"><label>处理方式</label>
      <div class="seg">
        <label><input type="radio" name="fmt" value="1" checked>格式化</label>
        <label><input type="radio" name="fmt" value="2">脱敏</label>
        <label><input type="radio" name="fmt" value="3">清洗</label>
        <label><input type="radio" name="fmt" value="4">国际码</label>
      </div></div>
    <div class="f">
      <div class="lh"><label>号码（空格或逗号分隔）</label>
        <button type="button" class="sm" data-file="fmt-text">选择文件</button></div>
      <textarea id="fmt-text">13800138000
+8616600138000</textarea>
      <input type="file" id="file-fmt-text" accept=".txt,.csv,.log,.dat,text/*" hidden></div>
    <div class="go"><button class="pri" data-act="phone/format">处理</button></div>
    <div class="out" id="out-fmt"></div>
  </div>
</div>

</div>
</section>

</main>

<footer>结果仅保证格式与校验位合法 · 请仅用于本人证件或已获授权的合法用途</footer>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, data){
  const r = await fetch('/api/' + path, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data||{})
  });
  return await r.json();
}
const show = (id, html) => { $('#'+id).innerHTML = html; };
const err  = m => '<div class="banner err">'+esc(m)+'</div>';
const kv = o => '<div class="kv">' + Object.entries(o).map(([k,v]) =>
  '<b>'+esc(k)+'</b><span>'+esc(v)+'</span>').join('') + '</div>';
const list = (items, cls) => '<pre class="'+(cls||'')+'">' + items.map(esc).join('\n') + '</pre>';
const table = (hs, rows) => '<table><thead><tr>' + hs.map(h=>'<th>'+esc(h)+'</th>').join('') +
  '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c=>'<td>'+c+'</td>').join('') + '</tr>').join('') +
  '</tbody></table>';
const stat = pairs => '<div class="stat">' + pairs.map(([k,v]) => esc(k)+': <b>'+esc(v)+'</b>').join('') + '</div>';

/* 大折叠：身份证 / 手机号 */
$$('.group').forEach(g => {
  g.querySelector('.gh').onclick = () => g.classList.toggle('on');
});

/* 小折叠：同时只开一个 */
$$('.acc').forEach(a => {
  a.querySelector('.acc-h').onclick = () => {
    const open = a.classList.contains('on');
    $$('.acc').forEach(x => x.classList.remove('on'));
    if(!open){
      a.classList.add('on');
      const grp = a.closest('.group');
      if(grp) grp.classList.add('on');
    }
  };
});

/* 下拉选项 */
const SX = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
const XZ = ['水瓶','双鱼','白羊','金牛','双子','巨蟹','狮子','处女','天秤','天蝎','射手','摩羯'];
$('#dv-sx').innerHTML = '<option value="">不限</option>' + SX.map(v=>'<option>'+v+'</option>').join('');
$('#dv-xz').innerHTML = '<option value="">不限</option>' + XZ.map(v=>'<option>'+v+'</option>').join('');

/* 各功能 */
const actions = {
  'id/brute': async () => {
    const g = document.querySelector('input[name=brute-g]:checked').value;
    const r = await api('id/brute', {prefix:$('#brute-prefix').value, gender:g});
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = stat([['候选总数', d.total], ['性别', g]]);
    if(d.combos > 1) h += '<div class="hint">? 占位展开 '+d.combos+' 种，过滤后剩 '+d.kept+' 种</div>';
    if(d.errors && d.errors.length) h += '<div class="banner warn">校验提示：'+d.errors.map(esc).join('；')+'</div>';
    if(d.infos && d.infos.length) h += '<div class="hint">'+d.infos.map(esc).join(' · ')+'</div>';
    h += list(d.results);
    if(d.truncated) h += '<div class="hint">仅显示前 5000 条</div>';
    return h;
  },
  'id/check': async () => {
    const r = await api('id/check', {raw:$('#check-raw').value});
    if(!r.ok) return err(r.error);
    const d = r.data;
    if(d.format_error) return err('格式错误：'+d.format_error);
    let h = '<div class="banner '+(d.valid?'ok':'err')+'">' +
      (d.valid ? '通过全部校验，格式合法' : '未通过校验，不是合法的身份证号') + '</div>';
    h += table(['','项目','说明'], d.checks.map(c => [
      c.pass===true ? '<span class="ok">[通过]</span>'
        : c.pass===false ? '<span class="err">[不通过]</span>' : '<span class="dim">[跳过]</span>',
      esc(c.name), esc(c.detail)]));
    h += '<div class="hint">性别(参考)：'+esc(d.gender)+'</div>';
    return h;
  },
  'id/checkdigit': async () => {
    const r = await api('id/checkdigit', {raw:$('#cd-raw').value});
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = kv({ '前17位':d.prefix, '校验位':d.check, '完整号':d.full, '出生':d.birth, '性别':d.gender });
    if(!d.date_ok) h += '<div class="banner warn">'+esc(d.date_msg)+'</div>';
    return h;
  },
  'id/info': async () => {
    const r = await api('id/info', {raw:$('#info-raw').value});
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = kv({ '号码':d.number, '省级':d.province, '地区':d.region, '出生':d.birth,
                 '年龄':(d.age!=null?d.age+' 周岁':'-'), '生肖':d.zodiac||'-',
                 '星座':d.constellation||'-', '性别':d.gender });
    if(d.warn) h += '<div class="banner warn">'+esc(d.warn)+'</div>';
    return h;
  },
  'id/derive': async () => {
    const r = await api('id/derive', {zodiac:$('#dv-sx').value, constellation:$('#dv-xz').value,
      age_min:$('#dv-a1').value, age_max:$('#dv-a2').value});
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = stat([['候选生日', d.count]]) + list(d.birthdays);
    if(d.truncated) h += '<div class="hint">仅显示前 3000 条</div>';
    return h;
  },
  'id/batch': async () => {
    const r = await api('id/batch', {text:$('#batch-text').value});
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = stat([['合计', d.total], ['合法', d.ok], ['不合法', d.bad]]);
    h += table(['号码','结果','说明'], d.rows.map(x => [
      '<span class="mono">'+esc(x.input)+'</span>',
      x.ok ? '<span class="ok">合法</span>' : '<span class="err">不合法</span>', esc(x.reason)]));
    return h;
  },
  'phone/lookup': async () => {
    const r = await api('phone/lookup', {text:$('#lk-text').value});
    if(!r.ok) return err(r.error);
    return table(['号码','归属地','运营商','邮编','区号'], r.data.rows.map(x => x.ok
      ? ['<span class="mono">'+esc(x.input)+'</span>', '<span class="ok">'+esc(x.region)+'</span>',
         esc(x.type), esc(x.zip), esc(x.area||'-')]
      : ['<span class="mono">'+esc(x.input)+'</span>', '<span class="err">'+esc(x.reason)+'</span>','','','']));
  },
  'phone/brute': async () => {
    const r = await api('phone/brute', {seg3:$('#pb-seg3').value, last2:$('#pb-last2').value,
      region:$('#pb-region').value});
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = stat([['总数', d.total]]) + list(d.results);
    if(d.truncated) h += '<div class="hint">仅显示前 20000 条</div>';
    return h;
  },
  'phone/seg': async () => {
    const r = await api('phone/seg', {keyword:$('#seg-kw').value});
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = stat([['匹配号段', d.total], ['归属地', d.groups.length]]);
    d.groups.forEach(g => {
      h += '<div style="margin:12px 0 2px"><b>'+esc(g.name)+' '+esc(g.type)+'</b> ' +
           '<span class="tag">'+g.count+' 个号段</span></div>';
      h += '<div class="segs">' + g.segments.map(s=>'<span>'+esc(s)+'</span>').join('') + '</div>';
    });
    return h;
  },
  'phone/format': async () => {
    const mode = document.querySelector('input[name=fmt]:checked').value;
    const r = await api('phone/format', {mode:mode, text:$('#fmt-text').value});
    if(!r.ok) return err(r.error);
    return table(['输入','结果'], r.data.rows.map(x => x.ok
      ? ['<span class="mono">'+esc(x.input)+'</span>', '<span class="mono ok">'+esc(x.result)+'</span>']
      : ['<span class="mono">'+esc(x.input)+'</span>', '<span class="err">'+esc(x.reason)+'</span>']));
  },
};

$$('button[data-act]').forEach(b => {
  b.onclick = async () => {
    const key = b.dataset.act;
    const acc = b.closest('.acc');
    const out = acc.querySelector('.out');
    b.disabled = true;
    out.innerHTML = '<div class="hint">处理中…</div>';
    try { out.innerHTML = await actions[key](); }
    catch(e){ out.innerHTML = err('请求失败：'+e.message); }
    finally { b.disabled = false; }
  };
});

/* 文件上传: 读取到文本框 */
function readTextFile(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(r.error || new Error('读取失败'));
    r.onload = () => {
      const buf = r.result;
      try {
        return res(new TextDecoder('utf-8', {fatal:true}).decode(buf));
      } catch(e){}
      try { return res(new TextDecoder('gbk').decode(buf)); } catch(e){}
      res(new TextDecoder('utf-8').decode(buf));
    };
    r.readAsArrayBuffer(file);
  });
}

async function loadFileTo(file, tid, btn){
  const ta = document.getElementById(tid);
  const text = await readTextFile(file);
  ta.value = text;
  const lines = text.split(/\r?\n/);
  const n = lines.filter(x => { const t = x.trim(); return t && !t.startsWith('#'); }).length;
  if(btn){
    btn.textContent = file.name.length > 16 ? file.name.slice(0,14) + '…' : file.name;
    btn.classList.add('ok');
  }
  let hint = ta.parentElement.querySelector('.fhint');
  if(!hint){
    hint = document.createElement('div');
    hint.className = 'hint fhint';
    ta.parentElement.appendChild(hint);
  }
  hint.textContent = '已载入 ' + file.name + '（' + n + ' 条有效行，' +
    (file.size < 1024 ? file.size + ' B' : Math.round(file.size/1024) + ' KB') + '）';
}

$$('button[data-file]').forEach(btn => {
  const tid = btn.dataset.file;
  const inp = document.getElementById('file-' + tid);
  const ta  = document.getElementById(tid);
  btn.onclick = () => inp.click();
  inp.onchange = async () => {
    const f = inp.files[0];
    inp.value = '';
    if(!f) return;
    try { await loadFileTo(f, tid, btn); }
    catch(e){ alert('读取失败：' + e.message); }
  };
  ta.addEventListener('dragover', e => { e.preventDefault(); ta.classList.add('drag'); });
  ta.addEventListener('dragleave', () => ta.classList.remove('drag'));
  ta.addEventListener('drop', async e => {
    e.preventDefault();
    ta.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if(!f) return;
    try { await loadFileTo(f, tid, btn); }
    catch(err){ alert('读取失败：' + err.message); }
  });
});

/* 版本与更新 */
async function loadVersion(){
  try{ const r = await api('version', {});
    if(r.ok) $('#ver').textContent = 'v' + r.data.version;
  }catch(e){}
}
async function checkUpdate(){
  const box = $('#msg');
  box.innerHTML = '<div class="banner">正在检查更新…</div>';
  try{
    const r = await api('check_update', {});
    if(!r.ok){ box.innerHTML = err(r.error); return; }
    const d = r.data;
    if(d.error){ box.innerHTML = '<div class="banner warn">'+esc(d.error)+'</div>'; return; }
    if(d.newer){
      box.innerHTML = '<div class="banner warn">发现新版本 <b>'+esc(d.remote)+'</b>（当前 '+esc(d.local)+'）' +
        '<div class="row" style="margin-top:10px">' +
        '<button class="pri sm" id="bUpd">立即更新</button>' +
        '<button class="sm" id="bSkip">跳过此版本</button>' +
        '<button class="sm" id="bMute">屏蔽所有更新</button>' +
        '<button class="sm" id="bClose">关闭</button></div></div>';
      $('#bUpd').onclick = () => doUpdate(box);
      $('#bSkip').onclick = async () => {
        await api('skip', {version:d.remote});
        box.innerHTML = '<div class="banner ok">已跳过版本 '+esc(d.remote)+'</div>';
        setTimeout(()=>{ box.innerHTML=''; }, 4000);
      };
      $('#bMute').onclick = async () => {
        await api('mute', {muted:true});
        box.innerHTML = '<div class="banner ok">已屏蔽所有更新提示' +
          '<br><span class="dim">恢复：终端执行 toolbox --unmute</span></div>';
        setTimeout(()=>{ box.innerHTML=''; }, 5000);
      };
      $('#bClose').onclick = () => { box.innerHTML=''; };
    } else if(d.muted){
      box.innerHTML = '<div class="banner dim">更新检查已屏蔽' +
        '<br>恢复：终端执行 <span class="mono">toolbox --unmute</span></div>';
      setTimeout(()=>{ box.innerHTML=''; }, 6000);
    } else if(d.was_skipped){
      box.innerHTML = '<div class="banner dim">版本 '+esc(d.remote)+' 已被跳过' +
        '<br>想安装：终端执行 <span class="mono">toolbox --update</span></div>';
      setTimeout(()=>{ box.innerHTML=''; }, 6000);
    } else {
      box.innerHTML = '<div class="banner ok">已是最新版本 ('+esc(d.local)+')</div>';
      setTimeout(()=>{ box.innerHTML=''; }, 4000);
    }
  }catch(e){ box.innerHTML = err('检查失败：'+e.message); }
}
async function doUpdate(box){
  box.innerHTML = '<div class="banner">正在更新…（git pull）</div>';
  try{
    const r = await api('update', {});
    if(!r.ok){ box.innerHTML = err(r.error); return; }
    const d = r.data;
    if(d.ok){
      let h = '<div class="banner ok">更新完成：'+esc(d.before)+' → <b>'+esc(d.after)+'</b>';
      if(d.changed) h += '<br><b>请重启</b>：终端 Ctrl+C 后重新运行 toolbox';
      box.innerHTML = h + '</div>';
      loadVersion();
    } else {
      box.innerHTML = '<div class="banner err">更新失败：'+esc(d.message)+'</div>';
    }
  }catch(e){ box.innerHTML = err('更新失败：'+e.message); }
}
$('#btnCheck').onclick = checkUpdate;
loadVersion();
</script>
