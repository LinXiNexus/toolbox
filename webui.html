<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>常用工具集</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --border:#272d39;
  --text:#d7dce5; --dim:#8b93a3; --accent:#3fc1c9; --ok:#4ade80;
  --err:#f87171; --warn:#fbbf24; --key:#fbbf24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:14px 16px 10px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:linear-gradient(180deg,#1a1f29,#0f1115);position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.5px}
header .ver{color:var(--dim);font-size:12px;font-weight:400}
header .sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel2);
  color:var(--text);padding:7px 13px;border-radius:8px;transition:.15s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--accent);color:#08222a;border-color:var(--accent);font-weight:600}
button.pri{background:var(--accent);color:#08222a;border-color:var(--accent);font-weight:600;padding:9px 20px}
button.pri:hover{filter:brightness(1.1);color:#08222a}
button.sm{padding:5px 10px;font-size:12px}
nav.tabs{display:flex;gap:8px;padding:12px 16px 0}
nav.tabs button{flex:1;max-width:180px}
nav.subs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
nav.subs::-webkit-scrollbar{display:none}
nav.subs button{white-space:nowrap;font-size:13px;padding:6px 12px}
main{padding:0 16px 60px;max-width:860px;margin:0 auto}
.panel{display:none}
.panel.on{display:block}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;color:var(--dim);font-size:12px;margin:0 0 5px}
input[type=text],input[type=number],textarea,select{
  width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:10px 12px;font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:90px}
select{font-family:inherit}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:130px}
.radios{display:flex;gap:8px}
.radios label{display:flex;align-items:center;gap:6px;color:var(--text);font-size:14px;margin:0;
  padding:8px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer}
.radios input{accent-color:var(--accent)}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
.act{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.out{margin-top:14px}
.out:empty{display:none}
pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;
  overflow:auto;max-height:420px;margin:0;font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace;
  white-space:pre-wrap;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:none}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:14px}
.kv b{color:var(--dim);font-weight:400;font-size:13px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.ok{color:var(--ok)} .err{color:var(--err)} .warn{color:var(--warn)} .dim{color:var(--dim)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;
  border:1px solid var(--border);color:var(--dim)}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.stat b{color:var(--key)}
.grid-seg{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.grid-seg span{font-family:ui-monospace,monospace;font-size:12px;background:var(--panel2);
  border:1px solid var(--border);padding:2px 7px;border-radius:5px}
footer{padding:16px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--border)}
.banner{padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;
  border:1px solid var(--border);background:var(--panel2)}
</style>
</head>
<body>

<header>
  <h1>常用工具集 <span class="ver" id="ver"></span></h1>
  <span class="sp"></span>
  <button class="sm" id="btnCheck">检查更新</button>
</header>

<nav class="tabs">
  <button class="on" data-tab="id">身份证</button>
  <button data-tab="phone">手机号</button>
</nav>

<main>
<div id="tab-update-msg"></div>

<!-- ==================== 身份证 ==================== -->
<section id="tab-id">
  <nav class="subs" data-group="id">
    <button class="on" data-sub="brute">后四位穷举</button>
    <button data-sub="check">校验18位</button>
    <button data-sub="cd">17位补校验位</button>
    <button data-sub="info">信息提取</button>
    <button data-sub="derive">按生肖/星座反推</button>
    <button data-sub="batch">批量校验</button>
  </nav>

  <div class="panel on" id="id-brute">
    <div class="card">
      <label>前 14 位（认不清的位用 ? 占位）</label>
      <input type="text" id="brute-prefix" placeholder="44030519900307" value="44030519900307">
      <div class="hint">结构：1-6 地址码 ｜ 7-14 出生日期 ｜ 15-17 顺序码 ｜ 18 校验码</div>
      <div class="act" style="margin-top:12px">
        <div class="radios">
          <label><input type="radio" name="brute-g" value="男" checked>男</label>
          <label><input type="radio" name="brute-g" value="女">女</label>
        </div>
      </div>
      <div class="act"><button class="pri" data-act="id/brute">开始穷举</button></div>
      <div class="out" id="out-brute"></div>
    </div>
  </div>

  <div class="panel" id="id-check">
    <div class="card">
      <label>完整 18 位号码</label>
      <input type="text" id="check-raw" placeholder="11010519491231002X" value="11010519491231002X">
      <div class="act"><button class="pri" data-act="id/check">校验</button></div>
      <div class="out" id="out-check"></div>
    </div>
  </div>

  <div class="panel" id="id-cd">
    <div class="card">
      <label>前 17 位</label>
      <input type="text" id="cd-raw" placeholder="11010519491231002" value="11010519491231002">
      <div class="act"><button class="pri" data-act="id/checkdigit">计算校验位</button></div>
      <div class="out" id="out-cd"></div>
    </div>
  </div>

  <div class="panel" id="id-info">
    <div class="card">
      <label>完整 18 位号码</label>
      <input type="text" id="info-raw" placeholder="440305199003070014" value="440305199003070014">
      <div class="act"><button class="pri" data-act="id/info">提取信息</button></div>
      <div class="out" id="out-info"></div>
    </div>
  </div>

  <div class="panel" id="id-derive">
    <div class="card">
      <div class="row">
        <div><label>生肖</label><select id="dv-sx"></select></div>
        <div><label>星座</label><select id="dv-xz"></select></div>
      </div>
      <div class="row" style="margin-top:12px">
        <div><label>最小年龄</label><input type="number" id="dv-a1" placeholder="如 30"></div>
        <div><label>最大年龄</label><input type="number" id="dv-a2" placeholder="如 40"></div>
      </div>
      <div class="hint">至少填一项，否则候选日期会覆盖 1900 年至今</div>
      <div class="act"><button class="pri" data-act="id/derive">反推生日</button></div>
      <div class="out" id="out-derive"></div>
    </div>
  </div>

  <div class="panel" id="id-batch">
    <div class="card">
      <label>号码列表（每行一个，空行和 # 开头的行会跳过）</label>
      <textarea id="batch-text" placeholder="11010519491231002X&#10;110105194912310021&#10;123"></textarea>
      <div class="act"><button class="pri" data-act="id/batch">批量校验</button></div>
      <div class="out" id="out-batch"></div>
    </div>
  </div>
</section>

<!-- ==================== 手机号 ==================== -->
<section id="tab-phone" style="display:none">
  <nav class="subs" data-group="phone">
    <button class="on" data-sub="lookup">归属地查询</button>
    <button data-sub="pbrute">前三后二穷举</button>
    <button data-sub="seg">号段反查</button>
    <button data-sub="fmt">格式化 / 脱敏</button>
  </nav>

  <div class="panel on" id="phone-lookup">
    <div class="card">
      <label>手机号（多个用空格或逗号分隔）</label>
      <textarea id="lk-text" placeholder="13800138000&#10;19912345678,16612345678">13800138000</textarea>
      <div class="act"><button class="pri" data-act="phone/lookup">查询</button></div>
      <div class="out" id="out-lookup"></div>
    </div>
  </div>

  <div class="panel" id="phone-pbrute">
    <div class="card">
      <div class="row">
        <div><label>前三位</label><input type="text" id="pb-seg3" placeholder="138" value="138" maxlength="3"></div>
        <div><label>后两位</label><input type="text" id="pb-last2" placeholder="88" value="88" maxlength="2"></div>
      </div>
      <label style="margin-top:12px">归属地筛选（可选，如 北京 / 唐山；留空 = 中间全排列 100 万）</label>
      <input type="text" id="pb-region" placeholder="留空则不筛选">
      <div class="act"><button class="pri" data-act="phone/brute">穷举</button></div>
      <div class="out" id="out-pbrute"></div>
    </div>
  </div>

  <div class="panel" id="phone-seg">
    <div class="card">
      <label>地区关键字</label>
      <input type="text" id="seg-kw" placeholder="北京 / 唐山 / 深圳">
      <div class="hint">全库检索约 1.5 秒</div>
      <div class="act"><button class="pri" data-act="phone/seg">反查号段</button></div>
      <div class="out" id="out-seg"></div>
    </div>
  </div>

  <div class="panel" id="phone-fmt">
    <div class="card">
      <div class="radios" id="fmt-modes">
        <label><input type="radio" name="fmt" value="1" checked>格式化</label>
        <label><input type="radio" name="fmt" value="2">脱敏</label>
        <label><input type="radio" name="fmt" value="3">清洗</label>
        <label><input type="radio" name="fmt" value="4">国际码</label>
      </div>
      <label style="margin-top:12px">号码（多个用空格或逗号分隔）</label>
      <textarea id="fmt-text" placeholder="13800138000&#10;+8616600138000">13800138000
+8616600138000</textarea>
      <div class="act"><button class="pri" data-act="phone/format">处理</button></div>
      <div class="out" id="out-fmt"></div>
    </div>
  </div>
</section>
</main>

<footer>结果仅保证格式与校验位合法 · 请仅用于本人证件或已获授权的合法用途</footer>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, data){
  const r = await fetch('/api/' + path, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data||{})
  });
  return await r.json();
}

function show(id, html){ const el = $('#'+id); el.innerHTML = html; }
function kv(obj){
  return '<div class="kv">' + Object.entries(obj).map(([k,v]) =>
    '<b>'+esc(k)+'</b><span>'+esc(v)+'</span>').join('') + '</div>';
}
function list(items, cls){
  return '<pre class="'+(cls||'')+'">' + items.map(esc).join('\n') + '</pre>';
}
function table(headers, rows){
  return '<table><thead><tr>' + headers.map(h=>'<th>'+esc(h)+'</th>').join('') +
    '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c=>'<td>'+c+'</td>').join('') + '</tr>').join('') +
    '</tbody></table>';
}
function stat(pairs){
  return '<div class="stat">' + pairs.map(([k,v]) => esc(k)+': <b>'+esc(v)+'</b>').join('') + '</div>';
}
function err(msg){ return '<div class="banner err">'+esc(msg)+'</div>'; }

/* ---------------- 标签切换 ---------------- */
$$('nav.tabs button').forEach(b => b.onclick = () => {
  $$('nav.tabs button').forEach(x => x.classList.toggle('on', x===b));
  $('#tab-id').style.display = b.dataset.tab==='id' ? '' : 'none';
  $('#tab-phone').style.display = b.dataset.tab==='phone' ? '' : 'none';
});
$$('nav.subs').forEach(nav => {
  const group = nav.dataset.group;
  nav.querySelectorAll('button').forEach(b => b.onclick = () => {
    nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
    document.querySelectorAll('#'+group+' .panel').forEach(p => p.classList.remove('on'));
    $('#'+group+'-'+b.dataset.sub).classList.add('on');
  });
});

/* ---------------- 下拉选项 ---------------- */
const SX = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
const XZ = ['水瓶','双鱼','白羊','金牛','双子','巨蟹','狮子','处女','天秤','天蝎','射手','摩羯'];
$('#dv-sx').innerHTML = '<option value="">不限</option>' + SX.map(v=>'<option>'+v+'</option>').join('');
$('#dv-xz').innerHTML = '<option value="">不限</option>' + XZ.map(v=>'<option>'+v+'</option>').join('');

/* ---------------- 各功能 ---------------- */
const actions = {
  'id/brute': async () => {
    const g = document.querySelector('input[name=brute-g]:checked').value;
    const r = await api('id/brute', {prefix:$('#brute-prefix').value, gender:g});
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = stat([['候选总数', d.total], ['性别', g]]);
    if(d.combos > 1) h += '<div class="hint">? 占位展开 '+d.combos+' 种，过滤后剩 '+d.kept+' 种</div>';
    if(d.errors && d.errors.length) h += '<div class="banner warn">校验提示：'+d.errors.map(esc).join('；')+'</div>';
    if(d.infos && d.infos.length) h += '<div class="hint">'+d.infos.map(esc).join(' · ')+'</div>';
    h += list(d.results);
    if(d.truncated) h += '<div class="hint">结果过多，仅显示前 5000 条</div>';
    show('out-brute', h);
  },
  'id/check': async () => {
    const r = await api('id/check', {raw:$('#check-raw').value});
    if(!r.ok) return err(r.error);
    const d = r.data;
    if(d.format_error) return show('out-check', err('格式错误：'+d.format_error));
    const rows = d.checks.map(c => {
      const mark = c.pass===true ? '<span class="ok">[通过]</span>'
                 : c.pass===false ? '<span class="err">[不通过]</span>'
                 : '<span class="dim">[跳过]</span>';
      return [mark, esc(c.name), esc(c.detail)];
    });
    let h = '<div class="banner '+(d.valid?'ok':'err')+'">' +
      (d.valid ? '通过全部校验，格式合法' : '未通过校验，不是合法的身份证号') + '</div>';
    h += table(['','项目','说明'], rows);
    h += '<div class="hint">性别(参考)：'+esc(d.gender)+'</div>';
    show('out-check', h);
  },
  'id/checkdigit': async () => {
    const r = await api('id/checkdigit', {raw:$('#cd-raw').value});
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = kv({ '前17位':d.prefix, '校验位':d.check, '完整号':d.full,
                 '出生':d.birth, '性别':d.gender });
    if(!d.date_ok) h += '<div class="banner warn">'+esc(d.date_msg)+'</div>';
    show('out-cd', h);
  },
  'id/info': async () => {
    const r = await api('id/info', {raw:$('#info-raw').value});
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = kv({ '号码':d.number, '省级':d.province, '地区':d.region, '出生':d.birth,
                 '年龄':(d.age!=null?d.age+' 周岁':'-'), '生肖':d.zodiac||'-',
                 '星座':d.constellation||'-', '性别':d.gender });
    if(d.warn) h += '<div class="banner warn">'+esc(d.warn)+'</div>';
    show('out-info', h);
  },
  'id/derive': async () => {
    const r = await api('id/derive', {
      zodiac:$('#dv-sx').value, constellation:$('#dv-xz').value,
      age_min:$('#dv-a1').value, age_max:$('#dv-a2').value });
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = stat([['候选生日', d.count]]);
    h += list(d.birthdays);
    if(d.truncated) h += '<div class="hint">仅显示前 3000 条</div>';
    show('out-derive', h);
  },
  'id/batch': async () => {
    const r = await api('id/batch', {text:$('#batch-text').value});
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = stat([['合计', d.total], ['合法', d.ok], ['不合法', d.bad]]);
    h += table(['号码','结果','说明'], d.rows.map(x => [
      '<span class="mono">'+esc(x.input)+'</span>',
      x.ok ? '<span class="ok">合法</span>' : '<span class="err">不合法</span>',
      esc(x.reason)]));
    show('out-batch', h);
  },
  'phone/lookup': async () => {
    const r = await api('phone/lookup', {text:$('#lk-text').value});
    if(!r.ok) return err(r.error);
    const rows = r.data.rows.map(x => x.ok
      ? ['<span class="mono">'+esc(x.input)+'</span>', '<span class="ok">'+esc(x.region)+'</span>',
         esc(x.type), esc(x.zip), esc(x.area||'-')]
      : ['<span class="mono">'+esc(x.input)+'</span>', '<span class="err">'+esc(x.reason)+'</span>','','','']);
    show('out-lookup', table(['号码','归属地','运营商','邮编','区号'], rows));
  },
  'phone/brute': async () => {
    const r = await api('phone/brute', {
      seg3:$('#pb-seg3').value, last2:$('#pb-last2').value, region:$('#pb-region').value });
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = stat([['总数', d.total]]);
    h += list(d.results);
    if(d.truncated) h += '<div class="hint">仅显示前 20000 条</div>';
    show('out-pbrute', h);
  },
  'phone/seg': async () => {
    const r = await api('phone/seg', {keyword:$('#seg-kw').value});
    if(!r.ok) return err(r.error);
    const d = r.data;
    let h = stat([['匹配号段', d.total], ['归属地', d.groups.length]]);
    d.groups.forEach(g => {
      h += '<div style="margin:12px 0 4px"><b>'+esc(g.name)+' '+esc(g.type)+'</b> ' +
           '<span class="tag">'+g.count+' 个号段</span></div>';
      h += '<div class="grid-seg">' + g.segments.map(s=>'<span>'+esc(s)+'</span>').join('') + '</div>';
    });
    show('out-seg', h);
  },
  'phone/format': async () => {
    const mode = document.querySelector('input[name=fmt]:checked').value;
    const r = await api('phone/format', {mode:mode, text:$('#fmt-text').value});
    if(!r.ok) return err(r.error);
    const rows = r.data.rows.map(x => x.ok
      ? ['<span class="mono">'+esc(x.input)+'</span>', '<span class="mono ok">'+esc(x.result)+'</span>']
      : ['<span class="mono">'+esc(x.input)+'</span>', '<span class="err">'+esc(x.reason)+'</span>']);
    show('out-fmt', table(['输入','结果'], rows));
  },
};

$$('button[data-act]').forEach(b => {
  b.onclick = async () => {
    const key = b.dataset.act;
    const out = b.closest('.card').querySelector('.out');
    b.disabled = true;
    out.innerHTML = '<div class="hint">处理中…</div>';
    try { await actions[key](); }
    catch(e){ show(out.id, err('请求失败：'+e.message)); }
    finally { b.disabled = false; }
  };
});

/* ---------------- 版本与更新 ---------------- */
async function loadVersion(){
  try{
    const r = await api('version', {});
    if(r.ok) $('#ver').textContent = 'v' + r.data.version;
  }catch(e){}
}
async function checkUpdate(){
  const box = $('#tab-update-msg');
  box.innerHTML = '<div class="banner">正在检查更新…</div>';
  try{
    const r = await api('check_update', {});
    if(!r.ok){ box.innerHTML = err(r.error); return; }
    const d = r.data;
    if(d.error){ box.innerHTML = '<div class="banner warn">'+esc(d.error)+'</div>'; return; }
    if(d.newer){
      box.innerHTML = '<div class="banner warn">发现新版本 <b>'+esc(d.remote)+'</b>（当前 '+esc(d.local)+'）' +
        '<br>在终端执行：<span class="mono">toolbox --update</span></div>';
    } else {
      box.innerHTML = '<div class="banner ok">已是最新版本 ('+esc(d.local)+')</div>';
    }
    setTimeout(()=>{ box.innerHTML=''; }, 6000);
  }catch(e){ box.innerHTML = err('检查失败：'+e.message); }
}
$('#btnCheck').onclick = checkUpdate;
loadVersion();
</script>
</body>
</html>
